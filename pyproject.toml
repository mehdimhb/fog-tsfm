[project]
name = "fog-tsfm"
version = "0.1.0"
description = "Freezing-of-gait detection from IMU data using frozen time-series foundation models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "fastai>=2.8.7",
    "huggingface-hub>=0.36.2",
    "lightning>=2.6.1",
    "lmdb>=1.7.5",
    "mantis-tsfm>=1.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "timm>=1.0.24",
    "torch>=2.11.0",
    "torchmetrics>=1.0",
    "tqdm>=4.67.3",
]
